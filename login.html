<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav id="nav"></nav>
        <h1>
            <svg class="logo" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M6 9l3 3-3 3"/>
                <path d="M12 15h5"/>
            </svg>
            Вхід
        </h1>
        <p>Увійди, щоб додавати задачі в каталог.</p>
    </header>

    <main>
        <form id="login-form" class="form" novalidate>
            <label>
                Username
                <input type="text" name="username" autocomplete="username" required>
                <span class="field-error" data-field="username"></span>
            </label>
            <label>
                Пароль
                <input type="password" name="password" autocomplete="current-password" required>
                <span class="field-error" data-field="password"></span>
            </label>
            <p class="error"></p>
            <button type="submit">Увійти</button>
            <p class="form-note">Немає акаунта? <a href="register.html">Зареєструватися</a></p>
        </form>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
